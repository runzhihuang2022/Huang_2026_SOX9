name: Processed-data numerical replay
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'config/**'
      - 'environment/**'
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r environment/requirements-replay.txt
      # Scientific figures require licensed Arial supplied by the runner owner.
      # Linux CI checks numerical inputs/privacy without silently substituting fonts.
      - run: python scripts/validate_release.py
      - run: python scripts/reproduce.py all --out outputs/ci_run --tables-only
